# Airhand iOS 工程（XcodeGen：`xcodegen generate` 生成 Airhand.xcodeproj，见 ../docs/ios.zh-CN.md）
name: Airhand
options:
  bundleIdPrefix: app.airhand
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    # Rust 核心：静态库按 SDK 放在 build/rust/<平台>，C 头文件和 module map 在 native/include
    LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/build/rust/$(PLATFORM_NAME)"
    SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/native/include"
    OTHER_LDFLAGS: "-lairhand_ios"
    # 编译时写进去的默认服务器和证书指纹（和桌面版、Android 一样，可以在设置里改）
    AIRHAND_SERVER: ""
    AIRHAND_SERVER_FP: ""
    APP_GROUP: group.app.airhand.ios

targets:
  Airhand:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Airhand
      - path: Shared
    preBuildScripts:
      - name: Rust core
        script: '"$PROJECT_DIR/scripts/build-rust.sh" "$PLATFORM_NAME" release'
        basedOnDependencyAnalysis: false
    dependencies:
      - target: AirhandBroadcast
        embed: true
      - sdk: VideoToolbox.framework
      - sdk: ReplayKit.framework
      - sdk: GameController.framework
      - sdk: AudioToolbox.framework
    entitlements:
      path: Airhand/Airhand.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.airhand.ios"]
    info:
      path: Airhand/Info.plist
      properties:
        CFBundleDisplayName: Airhand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "Airhand 会尝试在局域网里和对方设备直连，画面和声音不再绕道服务器，延迟更低。"
        NSMicrophoneUsageDescription: "只在你打开“麦克风”时把声音转发给正在控制的电脑，供那里的会议软件和语音输入使用。"
        CFBundleURLTypes:
          - CFBundleURLName: app.airhand.ios
            CFBundleURLSchemes: [airhand]
        AirhandServer: "$(AIRHAND_SERVER)"
        AirhandServerFingerprint: "$(AIRHAND_SERVER_FP)"
        AirhandAppGroup: "$(APP_GROUP)"
        AirhandBroadcastExtension: "$(PRODUCT_BUNDLE_IDENTIFIER).broadcast"
        # account-api 的地址（构建时由 build-ipa.sh 从环境变量 AIRHAND_ACCOUNT_API 传进来；
        # 留空就只能在登录页里手填。见 docs/account.zh-CN.md）
        AirhandAccountAPI: "$(AIRHAND_ACCOUNT_API)"
        # 账号服务一般是局域网里的 http://192.168.x.x:8080。ATS 默认拦明文 HTTP，
        # 而例外域名（NSExceptionDomains）填不了 IP，所以这里整体放开：
        # 只为了能连自建的账号服务，别的地方仍然只走 TLS。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.airhand.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AirhandBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
    preBuildScripts:
      - name: Rust core
        script: '"$PROJECT_DIR/scripts/build-rust.sh" "$PLATFORM_NAME" release'
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: VideoToolbox.framework
      - sdk: ReplayKit.framework
      - sdk: AudioToolbox.framework
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.airhand.ios"]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Airhand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AirhandServer: "$(AIRHAND_SERVER)"
        AirhandServerFingerprint: "$(AIRHAND_SERVER_FP)"
        AirhandAppGroup: "$(APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.airhand.ios.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

  AirhandTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Airhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.airhand.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Airhand.app/Airhand"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Airhand:
    build:
      targets:
        Airhand: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AirhandTests
    archive:
      config: Release
