# 放到你仓库的 .github/workflows/build-airhand.yml
#
# 前提：仓库 Settings → Secrets and variables → Actions → Repository secrets 里有四个：
#   AIRHAND_SERVER        形如 192.168.110.176:4433 或 www.example.com:4433（不要带 http://，不要加引号）
#   AIRHAND_SERVER_FP     64 位十六进制指纹（服务器日志里打印的那串，冒号可留可去）
#   AIRHAND_ACCOUNT_API   account-api 的地址，形如 http://192.168.110.176:8080
#                         规则：必须带 http:// 或 https://，只写 host:port，不要结尾斜杠、不要带路径
#                         只有 windows / macos 两个 job 强制要求（见下面说明），缺了会直接失败
#   AIRHAND_ACCOUNT_USER  可选，登录页预填的用户名（只预填用户名，密码永远不烧进客户端）
#
# 关于 account-api 地址是怎么进到客户端里的：
#   workflow 把 AIRHAND_ACCOUNT_API 作为**构建期环境变量**注入，四个平台的构建步骤都能读到。
#
#   • Windows / macOS / 网页控制台（client/ 里的 React + Tauri）：已经接好，不用再改代码。
#       构建时注 VITE_AIRHAND_ACCOUNT_API，client/src/lib/account.ts 里用
#       import.meta.env.VITE_AIRHAND_ACCOUNT_API 读它当登录页的默认服务器地址；
#       用户在登录页里改过的地址存在 localStorage，优先于这个默认值。
#       所以这两个平台的 job 里 secret 缺失 = 直接失败（避免产出一个连不上账号服务的包）。
#
#   • Android（android/）和 iOS（ios/）是**原生 Kotlin / Swift，没有 WebView**，
#       不加载 client/ 的 React 界面，所以它们暂时**不消费** AIRHAND_ACCOUNT_API：
#       APK / IPA 里没有账号登录页，连接方式和改造前一样（控制码 + 中继）。
#       这两个 job 只在这个 secret 缺失时给 warning，不会因此失败。
#       要给手机端也加登录，得在 Kotlin / Swift 里各写一套界面和 HTTP 客户端，并且注意：
#         - Android 9+ 禁止明文 HTTP：AndroidManifest 的 <application> 要加
#           android:usesCleartextTraffic="true"，否则 http:// 内网地址请求直接失败；
#         - iOS 的 ATS 同理：Info.plist（由 ios/project.yml 生成）要加
#           NSAppTransportSecurity → NSAllowsLocalNetworking = true。
#       这两条不加的话现象是「客户端报网络错误、服务端日志干干净净」，最难查。
#
# 触发：
#   • Actions → 左侧 build-airhand → Run workflow
#     会出现四个勾选框，取消勾选就不构建那个平台（比如只留 android）
#   • 打 tag 推送时自动构建全部四个平台（tag 触发没有勾选框）
#
# 产物（运行页底部 Artifacts）：
#   airhand-windows         NSIS 安装包
#   airhand-macos-arm64     Apple Silicon 的 dmg + app
#   airhand-android         APK（arm64-v8a / armeabi-v7a / x86_64）
#   airhand-ios-unsigned    未签名的 ipa，安装前必须自己重签
#
# 版本说明（2026-11-25 逐个打开 action.yml 核对的 runs.using）：
#   actions/checkout@v7        node24
#   actions/setup-node@v7      node24
#   actions/setup-java@v6      node24
#   actions/upload-artifact@v7 node24（v6 及更早仍是 node20，别降级）
#   Swatinem/rust-cache@v2     node24（2.9.3）
#   gradle/actions@v6          composite
#   dtolnay/rust-toolchain     composite
#
# macOS 桌面端只出 Apple Silicon（arm64）包，不再构建 Intel / universal 版本。

name: build-airhand

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 构建 Windows 安装包
        type: boolean
        default: false
      macos:
        description: 构建 macOS（Apple Silicon）
        type: boolean
        default: false
      android:
        description: 构建 Android APK
        type: boolean
        default: true
      ios:
        description: 构建 iOS（未签名 ipa）
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  AIRHAND_SERVER: ${{ secrets.AIRHAND_SERVER }}
  AIRHAND_SERVER_FP: ${{ secrets.AIRHAND_SERVER_FP }}
  # account-api 地址：构建期烧进客户端，运行期不再需要配置
  AIRHAND_ACCOUNT_API: ${{ secrets.AIRHAND_ACCOUNT_API }}
  # 同一个值再以 VITE_ 前缀导出一次，给前端（Vite）用
  VITE_AIRHAND_ACCOUNT_API: ${{ secrets.AIRHAND_ACCOUNT_API }}
  # 登录页预填的用户名，可以为空
  AIRHAND_ACCOUNT_USER: ${{ secrets.AIRHAND_ACCOUNT_USER }}
  VITE_AIRHAND_ACCOUNT_USER: ${{ secrets.AIRHAND_ACCOUNT_USER }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    # 手动触发时看勾选框；tag 推送时没有 inputs，一律构建
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # secret 缺失时这里直接失败，避免静默烧进作者内置的公益服务器地址
      - name: 校验 secret
        shell: bash
        env:
          S: ${{ secrets.AIRHAND_SERVER }}
          F: ${{ secrets.AIRHAND_SERVER_FP }}
          A: ${{ secrets.AIRHAND_ACCOUNT_API }}
        run: |
          if [ -z "$S" ] || [ -z "$F" ]; then
            echo "::error::缺少 AIRHAND_SERVER 或 AIRHAND_SERVER_FP secret"
            exit 1
          fi
          if ! printf '%s' "$F" | tr -d ': ' | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::AIRHAND_SERVER_FP 不是 64 位十六进制"
            exit 1
          fi
          case "$S" in
            http*://*) echo "::error::AIRHAND_SERVER 只写 host:port，不要带协议前缀"; exit 1 ;;
          esac
          if [ -z "$A" ]; then
            echo "::error::缺少 AIRHAND_ACCOUNT_API secret（形如 http://192.168.110.176:8080）"
            exit 1
          fi
          if ! printf '%s' "$A" | grep -Eq '^https?://[^/]+$'; then
            echo "::error::AIRHAND_ACCOUNT_API 必须是 http(s)://host:port，不能以 / 结尾、不能带路径"
            exit 1
          fi
          case "$A" in
            http://*) echo "::warning::AIRHAND_ACCOUNT_API 是明文 HTTP，仅适用于内网自用" ;;
          esac
          echo "中继地址：$S（指纹格式校验通过）"
          echo "账号服务：$A"

      # Node 20 已于 2026-04 EOL，runner 上的 node20 运行时也在 2026-09 移除
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装 NASM
        run: choco install nasm -y --no-progress

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      # AIRHAND_ACCOUNT_API / VITE_AIRHAND_ACCOUNT_API 已在 workflow 级 env 里，
      # 这里再显式写一遍，方便看清哪些变量会进最终产物
      - name: 编译
        working-directory: client
        env:
          AIRHAND_ACCOUNT_API: ${{ env.AIRHAND_ACCOUNT_API }}
          VITE_AIRHAND_ACCOUNT_API: ${{ env.VITE_AIRHAND_ACCOUNT_API }}
          VITE_AIRHAND_ACCOUNT_USER: ${{ env.VITE_AIRHAND_ACCOUNT_USER }}
        run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: airhand-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    # macos-latest 与 macos-15 都是 arm64，编出来的就是 Apple Silicon 原生包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 secret
        shell: bash
        env:
          S: ${{ secrets.AIRHAND_SERVER }}
          F: ${{ secrets.AIRHAND_SERVER_FP }}
          A: ${{ secrets.AIRHAND_ACCOUNT_API }}
        run: |
          if [ -z "$S" ] || [ -z "$F" ]; then
            echo "::error::缺少 AIRHAND_SERVER 或 AIRHAND_SERVER_FP secret"
            exit 1
          fi
          if ! printf '%s' "$F" | tr -d ': ' | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::AIRHAND_SERVER_FP 不是 64 位十六进制"
            exit 1
          fi
          if [ -z "$A" ]; then
            echo "::error::缺少 AIRHAND_ACCOUNT_API secret（形如 http://192.168.110.176:8080）"
            exit 1
          fi
          if ! printf '%s' "$A" | grep -Eq '^https?://[^/]+$'; then
            echo "::error::AIRHAND_ACCOUNT_API 必须是 http(s)://host:port，不能以 / 结尾、不能带路径"
            exit 1
          fi
          echo "中继地址：$S（指纹格式校验通过）"
          echo "账号服务：$A"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # 不再装 x86_64-apple-darwin：只编 runner 自己的架构（arm64）
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装 CMake
        run: brew install cmake

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 编译 Apple Silicon 包
        working-directory: client
        env:
          AIRHAND_ACCOUNT_API: ${{ env.AIRHAND_ACCOUNT_API }}
          VITE_AIRHAND_ACCOUNT_API: ${{ env.VITE_AIRHAND_ACCOUNT_API }}
          VITE_AIRHAND_ACCOUNT_USER: ${{ env.VITE_AIRHAND_ACCOUNT_USER }}
        run: npm run tauri build -- --bundles app,dmg

      - uses: actions/upload-artifact@v7
        with:
          name: airhand-macos-arm64
          path: |
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.android
    # 上游也用 ubuntu-24.04：runner 自带 ANDROID_HOME 与 cmdline-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Android 是原生界面，还不消费 AIRHAND_ACCOUNT_API，所以缺了只提示不拦
      - name: 校验 secret
        shell: bash
        env:
          S: ${{ secrets.AIRHAND_SERVER }}
          F: ${{ secrets.AIRHAND_SERVER_FP }}
          A: ${{ secrets.AIRHAND_ACCOUNT_API }}
        run: |
          if [ -z "$S" ] || [ -z "$F" ]; then
            echo "::error::缺少 AIRHAND_SERVER 或 AIRHAND_SERVER_FP 这两个 secret"
            exit 1
          fi
          if ! printf '%s' "$F" | tr -d ': ' | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::AIRHAND_SERVER_FP 不是 64 位十六进制"
            exit 1
          fi
          echo "中继地址：$S（指纹格式校验通过）"
          if [ -z "$A" ]; then
            echo "::warning::没有 AIRHAND_ACCOUNT_API：Android 端本来也没接账号登录，APK 功能不受影响"
          elif ! printf '%s' "$A" | grep -Eq '^https?://[^/]+$'; then
            echo "::warning::AIRHAND_ACCOUNT_API 格式不像 http(s)://host:port（$A），先忽略"
          else
            echo "账号服务：$A（Android 原生端尚未接入，仅记录）"
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      # NDK 版本必须和 Gradle 里要求的一致，否则 cargo-ndk 找不到工具链
      - name: 安装 Android SDK 组件
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
      - uses: gradle/actions/setup-gradle@v6

      # AIRHAND_ACCOUNT_API 这里照旧导出，但 Kotlin 侧还没有代码读它（原生界面没接账号登录）；
      # 以后接入时在 android/app/build.gradle.kts 里
      #   buildConfigField("String", "ACCOUNT_API", "\"${System.getenv("AIRHAND_ACCOUNT_API") ?: ""}\"")
      # Kotlin 在 Gradle 进程内编译：CI 只构建一次，没必要单开 Kotlin 守护进程
      - name: 编译 APK
        working-directory: android
        env:
          AIRHAND_ACCOUNT_API: ${{ env.AIRHAND_ACCOUNT_API }}
          AIRHAND_ACCOUNT_USER: ${{ env.AIRHAND_ACCOUNT_USER }}
        run: ./gradlew assembleRelease -Pkotlin.compiler.execution.strategy=in-process

      - uses: actions/upload-artifact@v7
        with:
          name: airhand-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    # 上游注释：代码用到了新 SDK 的接口（allowBluetoothHFP），macos-15 自带的 Xcode 16.4 编不过，
    # 必须用 Xcode 27 的镜像。xcode-27 是 GitHub 按 Xcode 版本命名的 runner 标签。
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # iOS 同样是原生界面，还不消费 AIRHAND_ACCOUNT_API，所以缺了只提示不拦
      - name: 校验 secret
        shell: bash
        env:
          S: ${{ secrets.AIRHAND_SERVER }}
          F: ${{ secrets.AIRHAND_SERVER_FP }}
          A: ${{ secrets.AIRHAND_ACCOUNT_API }}
        run: |
          if [ -z "$S" ] || [ -z "$F" ]; then
            echo "::error::缺少 AIRHAND_SERVER 或 AIRHAND_SERVER_FP 这两个 secret"
            exit 1
          fi
          if ! printf '%s' "$F" | tr -d ': ' | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::AIRHAND_SERVER_FP 不是 64 位十六进制"
            exit 1
          fi
          echo "中继地址：$S（指纹格式校验通过）"
          if [ -z "$A" ]; then
            echo "::warning::没有 AIRHAND_ACCOUNT_API：iOS 端本来也没接账号登录，IPA 功能不受影响"
          elif ! printf '%s' "$A" | grep -Eq '^https?://[^/]+$'; then
            echo "::warning::AIRHAND_ACCOUNT_API 格式不像 http(s)://host:port（$A），先忽略"
          else
            echo "账号服务：$A（iOS 原生端尚未接入，仅记录）"
          fi
      - name: 选择 Xcode
        run: |
          if [ -n "${XCODE_VERSION:-}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # 不设 TEAM_ID：产出 ad-hoc 签名的 IPA，安装前要自己重签（见 docs/ios.md）
      # build-ipa.sh 从环境变量读取 AIRHAND_ACCOUNT_API，写进 Info.plist 的 AirhandAccountAPI 键，
      # 并在 Info.plist 里带上 ATS 例外，否则 http:// 会被系统拦截
      - name: 编译 IPA
        env:
          AIRHAND_ACCOUNT_API: ${{ env.AIRHAND_ACCOUNT_API }}
          AIRHAND_ACCOUNT_USER: ${{ env.AIRHAND_ACCOUNT_USER }}
        run: ios/scripts/build-ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: airhand-ios-unsigned
          path: ios/build/Airhand.ipa
          if-no-files-found: error
