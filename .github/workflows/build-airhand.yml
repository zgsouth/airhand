# 放到你仓库的 .github/workflows/build-airhand.yml
#
# 触发：仓库页面 Actions → 左侧 build-airhand → Run workflow
# 产物：Actions 运行页底部的 Artifacts（airhand-windows / airhand-macos）
#
# 注意：windows-latest 自带 VS2022 的 C++ 工具链和 CMake，但没有 NASM，
# openh264 的汇编需要它，所以下面用 choco 装一次。

name: build-airhand

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # 烧进安装包的默认值。不想公开的话改成 secrets.AIRHAND_SERVER / secrets.AIRHAND_SERVER_FP，
  # 然后在 Settings → Secrets and variables → Actions 里建这两个 secret。
  AIRHAND_SERVER: 192.168.110.176:4433
  AIRHAND_SERVER_FP: fad651cf07ef9a08f7ef3ebf69b90b5e2722e632dd5af79a470a8d04e675a17c
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装 NASM
        run: choco install nasm -y --no-progress

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 编译
        working-directory: client
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装 CMake
        run: brew install cmake

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 编译通用包
        working-directory: client
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: airhand-macos
          path: |
            client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
