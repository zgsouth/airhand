# 放到你仓库的 .github/workflows/build-airhand.yml
#
# 前提：仓库 Settings → Secrets and variables → Actions → Repository secrets 里有两个：
#   AIRHAND_SERVER      形如 192.168.110.176:4433 或 www.example.com:4433（不要带 http://，不要加引号）
#   AIRHAND_SERVER_FP   64 位十六进制指纹（服务器日志里打印的那串，冒号可留可去）
#
# 触发：Actions → 左侧 build-airhand → Run workflow
# 产物：运行页底部的 Artifacts（airhand-windows / airhand-macos）
#
# 版本说明（2026-11 逐个打开 action.yml 核对的 runs.using，不是看版本号猜的）：
#   actions/checkout@v7        node24
#   actions/setup-node@v7      node24
#   actions/upload-artifact@v7 node24（v6 及更早仍是 node20，别降级）
#   Swatinem/rust-cache@v2     node24（2.9.3）
#   dtolnay/rust-toolchain     composite，无 node 运行时
#
# runner 一律用 -latest：写死版本号会像 macos-14 那样到期直接失效。
# 若 macOS 26 上构建异常，把 macos-latest 换成 macos-15（仍受支持的固定 arm64 版）。

name: build-airhand

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  AIRHAND_SERVER: ${{ secrets.AIRHAND_SERVER }}
  AIRHAND_SERVER_FP: ${{ secrets.AIRHAND_SERVER_FP }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # secret 缺失时这里直接失败，避免静默烧进作者内置的公益服务器地址
      - name: 校验 secret
        shell: bash
        env:
          S: ${{ secrets.AIRHAND_SERVER }}
          F: ${{ secrets.AIRHAND_SERVER_FP }}
        run: |
          if [ -z "$S" ] || [ -z "$F" ]; then
            echo "::error::缺少 AIRHAND_SERVER 或 AIRHAND_SERVER_FP secret"
            exit 1
          fi
          if ! printf '%s' "$F" | tr -d ': ' | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::AIRHAND_SERVER_FP 不是 64 位十六进制"
            exit 1
          fi
          case "$S" in
            http*://*) echo "::error::AIRHAND_SERVER 只写 host:port，不要带协议前缀"; exit 1 ;;
          esac
          echo "中继地址：$S（指纹格式校验通过）"

      # Node 20 已于 2026-04 EOL，runner 上的 node20 运行时也在 2026-09 移除
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装 NASM
        run: choco install nasm -y --no-progress

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 编译
        working-directory: client
        run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: airhand-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 校验 secret
        shell: bash
        env:
          S: ${{ secrets.AIRHAND_SERVER }}
          F: ${{ secrets.AIRHAND_SERVER_FP }}
        run: |
          if [ -z "$S" ] || [ -z "$F" ]; then
            echo "::error::缺少 AIRHAND_SERVER 或 AIRHAND_SERVER_FP secret"
            exit 1
          fi
          if ! printf '%s' "$F" | tr -d ': ' | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::AIRHAND_SERVER_FP 不是 64 位十六进制"
            exit 1
          fi
          echo "中继地址：$S（指纹格式校验通过）"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装 CMake
        run: brew install cmake

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 编译通用包
        working-directory: client
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v7
        with:
          name: airhand-macos
          path: |
            client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
